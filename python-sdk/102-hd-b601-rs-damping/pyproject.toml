[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stararm-rs-unloaded-damping"
version = "0.1.0"
description = "StarArm 102-HD fixed damping teleoperation and B601-RS gripper contact hold"
requires-python = ">=3.10"
dependencies = ["python-can>=4.2,<5"]

[tool.setuptools.packages.find]
include = ["stararm_rs_damping*"]

[tool.setuptools.package-data]
stararm_rs_damping = ["web/**/*", "web/*.html", "web/*.css", "web/*.js"]
