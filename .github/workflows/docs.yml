name: Documentation and Python entry checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r scripts/requirements-docs.txt -r python-sdk/102-ld-hd-to-102-fl/single-pair/requirements.txt
      - run: python scripts/check_docs.py
      - run: python scripts/check_readme_sync.py
      - run: python -m unittest discover -s tests -v
